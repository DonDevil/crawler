crawler:
  engine: "auto"
  concurrency: 25
  timeout: 15
  max_pages: 200
  rate_limit: 0.3
  user_agent: "AntiPiracyBot/1.0"
  scrapling_enabled: true
  scrapling_headless: true
  scrapling_stealth: true
  scrapling_network_idle: true
  frontier:
    #type: "sqlite"
    # For distributed multi-worker crawling, set type to "redis" and configure Redis server:
    type: "redis"
    redis_host: "localhost"
    redis_port: 6379
    redis_namespace: "crawler"
    # Shared retry/backoff, applied uniformly by whichever frontier is active.
    max_retries: 3
    base_backoff: 5.0
    max_backoff: 300.0
    # Redis claim lease + background recovery sweep (core/crawler_manager.py's
    # recovery task). No effect on the local/sqlite frontier's behavior.
    lease_ttl: 90.0
    recovery_enabled: true
    recovery_interval: 30.0
    reclaim_batch_size: 200
    domain_scan_limit: 50
    # Claim heartbeat (core/claim_heartbeat.py): lets a worker still
    # legitimately fetching a URL renew its claim instead of losing it to
    # lease expiry. Leave unset (null) to auto-derive a safe interval from
    # lease_ttl above (lease_ttl / 3, so a live worker gets two renewal
    # attempts of margin before its lease could lapse). Only set this to
    # override that default -- it is always clamped below lease_ttl no
    # matter what's configured here.
    #heartbeat_interval: null
  seed_files:
    - "seeds/piracy_sites.txt"
    - "seeds/torrent_sites.txt"
    - "seeds/streaming_sites.txt"
    - "seeds/darkweb_seeds.txt"
  storage:
    sqlite_path: "storage/crawl_state.db"
    media_sqlite_path: "storage/media_evidence.db"
    enable_media_evidence: true
    enqueue_media_jobs: true
search:
  enabled_engines:
    - "duckduckgo"
    - "bing"
    - "brave"
    - "yandex"
    - "ahmia"
    - "torch"
  max_results_per_engine: 20
  timeout: 15
  engine_priorities:
    torch: 0
    ahmia: 2
    brave: 4
    bing: 5
    duckduckgo: 6
    yandex: 7
  onion_priority_boost: 2
  blocked_engine_cooldown_queries: 999
